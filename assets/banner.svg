<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rohan Islam - Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#140f2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#b57bff"/>
      <animate attributeName="x1" values="-0.5;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;1.5" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d4aff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipName">
      <rect x="80" y="100" height="100" width="0">
        <animate attributeName="width" values="0;760;760;0;0" keyTimes="0;0.24;0.46;0.5;1" dur="10s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clipRole">
      <rect x="80" y="120" height="80" width="0">
        <animate attributeName="width" values="0;0;640;640;0" keyTimes="0;0.5;0.74;0.96;1" dur="10s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>

  <g fill="#7aa2ff" opacity="0.12">
    <circle cx="60" cy="40" r="2"/><circle cx="100" cy="40" r="2"/><circle cx="140" cy="40" r="2"/>
    <circle cx="60" cy="290" r="2"/><circle cx="100" cy="290" r="2"/><circle cx="140" cy="290" r="2"/>
    <animate attributeName="opacity" values="0.05;0.2;0.05" dur="3s" repeatCount="indefinite"/>
  </g>

  <circle cx="1000" cy="160" r="190" fill="url(#glow)">
    <animate attributeName="r" values="170;200;170" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="160" r="95" fill="none" stroke="#7aa2ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" from="0 1000 160" to="360 1000 160" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="160" r="150" fill="none" stroke="#b57bff" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="3 12">
    <animateTransform attributeName="transform" type="rotate" from="360 1000 160" to="0 1000 160" dur="45s" repeatCount="indefinite"/>
  </circle>

  <text x="80" y="78" font-family="'Courier New', Consolas, monospace" font-size="16" letter-spacing="4" fill="#7aa2ff" opacity="0">
    &lt;/&gt;  CODE · BUILD · LEARN · IMPROVE
    <animate attributeName="opacity" from="0" to="0.85" dur="1s" begin="0s" fill="freeze"/>
  </text>

  <!-- ROHAN ISLAM (types, then erases) -->
  <g clip-path="url(#clipName)">
    <text x="80" y="180" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="88" font-weight="800" letter-spacing="3" fill="url(#name)">ROHAN ISLAM</text>
  </g>
  <g>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="10s" begin="0.4s" repeatCount="indefinite"/>
    <rect x="80" y="108" width="4" height="84" fill="#7aa2ff">
      <animate attributeName="x" values="80;770;770;80;80" keyTimes="0;0.24;0.46;0.5;1" dur="10s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Frontend Developer (types, then erases) -->
  <g clip-path="url(#clipRole)">
    <text x="80" y="180" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="2" fill="url(#name)">Frontend Developer</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="10s" begin="0.4s" repeatCount="indefinite"/>
    <rect x="80" y="132" width="4" height="56" fill="#4ade80">
      <animate attributeName="x" values="80;80;680;680;80" keyTimes="0;0.5;0.74;0.96;1" dur="10s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="'Courier New', Consolas, monospace" font-size="22" fill="#c9d1ff">
    <text x="80" y="250" opacity="0">HTML5  •  CSS3  •  Tailwind CSS
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.03;0.17;0.2;1" dur="20s" begin="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="250" opacity="0">JavaScript  •  TypeScript
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.23;0.37;0.4;1" dur="20s" begin="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="250" opacity="0">React  •  Next.js  •  Git &amp; GitHub
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.43;0.57;0.6;1" dur="20s" begin="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="250" opacity="0">Better Auth  •  Node.js
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.63;0.77;0.8;1" dur="20s" begin="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="250" opacity="0">MongoDB  •  Mongoose
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.83;0.97;1;1" dur="20s" begin="3.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <g font-family="'Courier New', Consolas, monospace" font-weight="700" text-anchor="middle">
    <g transform="translate(1000,160)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/>
        <circle r="40" fill="#1b2146" stroke="#7aa2ff" stroke-width="2"/>
        <text y="9" font-size="26" fill="#7aa2ff">&lt;/&gt;</text>
      </g>
    </g>
    <g transform="translate(880,55)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="3.2s" repeatCount="indefinite"/>
        <rect x="-42" y="-17" width="84" height="34" rx="17" fill="#1b2146" stroke="#ff7a45"/>
        <text y="6" font-size="17" fill="#ff7a45">HTML</text>
      </g>
    </g>
    <g transform="translate(1015,38)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="3.8s" repeatCount="indefinite"/>
        <rect x="-36" y="-17" width="72" height="34" rx="17" fill="#1b2146" stroke="#38bdf8"/>
        <text y="6" font-size="17" fill="#38bdf8">CSS</text>
      </g>
    </g>
    <g transform="translate(1140,72)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.4s" repeatCount="indefinite"/>
        <rect x="-30" y="-17" width="60" height="34" rx="17" fill="#1b2146" stroke="#facc15"/>
        <text y="6" font-size="17" fill="#facc15">JS</text>
      </g>
    </g>
    <g transform="translate(868,160)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="3.9s" repeatCount="indefinite"/>
        <rect x="-48" y="-17" width="96" height="34" rx="17" fill="#1b2146" stroke="#22d3ee"/>
        <text y="6" font-size="17" fill="#22d3ee">React</text>
      </g>
    </g>
    <g transform="translate(1118,160)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.6s" repeatCount="indefinite"/>
        <rect x="-59" y="-17" width="118" height="34" rx="17" fill="#1b2146" stroke="#2dd4bf"/>
        <text y="6" font-size="17" fill="#2dd4bf">Tailwind</text>
      </g>
    </g>
    <g transform="translate(895,262)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -11;0 0" dur="4.1s" repeatCount="indefinite"/>
        <rect x="-30" y="-17" width="60" height="34" rx="17" fill="#1b2146" stroke="#60a5fa"/>
        <text y="6" font-size="17" fill="#60a5fa">TS</text>
      </g>
    </g>
    <g transform="translate(1060,268)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="3.7s" repeatCount="indefinite"/>
        <rect x="-50" y="-17" width="100" height="34" rx="17" fill="#1b2146" stroke="#e5e7eb"/>
        <text y="6" font-size="17" fill="#e5e7eb">Next.js</text>
      </g>
    </g>
  </g>
</svg>
